# ESAM crew tasks. Step 0 (environment) runs before every pipeline.

check_environment:
  description: >
    Run the inspect_environment tool for the '{environment}' environment and read
    every probe. Write a short environment report: one line per service with its
    state, the tools the crew may use, and for each service that is not OK the
    exact fix (the variable to set, the command to run). Name secrets by their
    variable only. End with GREEN LIGHT if a reasoning model is available and
    the tools this run needs ({needed_tools}) are enabled, otherwise NOT READY.
  expected_output: >
    A markdown environment report ending with a single line: GREEN LIGHT or NOT READY.
  agent: environment_engineer

# ── Pipeline A: a document arrives → verified ingestion ─────────────────────
# A1 and A2 run, then the pipeline STOPS: an SE reads approval_request.md and
# runs `approve` or `reject`. Only then do A3 and A4 run.

a1_ontology_check:
  description: >
    A document arrived for ingestion: {document} (run {run_id}). Run ontology_check
    and read every finding. State what the document is: id, MIL-STD-498 type and
    name, revision, the subsystem it is for and whether that subsystem is
    safety-critical, whether it replaces an earlier revision, and which ontology
    rule (if any) requires this document for the subsystem. Run check_coverage
    for the subsystem to show which required documents are present or MISSING
    before this one. Use ontology_lookup when a term needs explaining. Report
    every ontology finding verbatim; an error means the document cannot be
    ingested as it stands, and you name the field to fix.
  expected_output: >
    A short markdown classification with the facts above, the ontology findings
    (or "none"), and a last line: ONTOLOGY OK or ONTOLOGY FAIL.
  agent: triage

a2_document_review:
  description: >
    Review the content of {document}. Run review_document. For a test
    description, compare each test case's pass criteria with the text of every
    requirement it verifies: the numbers, units and conditions must match or
    be stricter; say for each test case MATCHES, STRICTER, WEAKER or UNCLEAR
    and quote both sides. Note test cases whose cited requirement is already
    verified elsewhere, and the subsystem's requirements that remain untested
    after this document. For an SRS, check every requirement is a single,
    testable 'shall' with a measurable value, and flag any that is not. Use
    search_documents or verified_by only to confirm something in the
    document against an existing one; cite document ids. Report the tool's
    issues list verbatim.
  expected_output: >
    A markdown review: a table per test case (or requirement) with the
    comparison and verdict, the issues, and what remains untested.
  agent: researcher

a2_approval_request:
  description: >
    Write the approval request an SE will read before deciding whether
    {document} enters the baseline (run {run_id}). From the classification and
    the review: what was checked, what passed, what failed, and anything a human
    must decide. Do not repeat tables; summarise and point to the failures.
    Recommend INGEST only if the ontology check is OK and no test case is WEAKER
    than its requirement (or no requirement is untestable); otherwise DO NOT
    INGEST, with the fix. Remind the SE that approval is theirs: they run
    `python -m crew.main approve {run_id}` or `python -m crew.main reject {run_id}`.
  expected_output: >
    A markdown approval request of at most one page, ending with one line:
    RECOMMENDATION: INGEST or RECOMMENDATION: DO NOT INGEST.
  agent: se_reviewer

a3_ingest:
  description: >
    The SE approved run {run_id}. Run ingest_document once and report exactly
    what it did: the baseline line added (and any revision it replaced), the
    chunks stored, and the requirements, test cases and VERIFIES links the
    graph now holds. If the tool refuses, report the refusal verbatim and stop.
  expected_output: >
    A short markdown ingest record, or the refusal.
  agent: researcher

a4_verify:
  description: >
    Verify that {document} is really in (run {run_id}). Run verify_ingestion and
    report every check with expected and found. From its health section, list
    the health findings this ingest closed and any it opened, and the roll-up
    change. A finding opened by this ingest, or any failed check, means NOT
    VERIFIED; say what to do (`python -m crew.main undo {run_id}` reverses the
    ingest).
  expected_output: >
    A markdown verification report ending with one line: VERIFIED or NOT VERIFIED.
  agent: se_reviewer

# ── Interactive: an SE's question ───────────────────────────────────────────

ask_triage:
  description: >
    An SE asks: "{request}". Identify the subsystems, document types and
    requirement or test ids involved (use ontology_lookup, walk_graph and
    check_coverage). State which documents would answer it and which of
    those are MISSING. Do not answer the question yet.
  expected_output: >
    A short triage: entities involved, documents needed (present or MISSING),
    and what the researcher should look up.
  agent: triage

ask_research:
  description: >
    Answer "{request}" from the tools only, following the triage. Every fact
    carries, in brackets, the document id it came from, e.g. [SRS-BRK-001]
    (a requirement's document is in verified_by's 'document' field), or
    [graph] for structure and traceability. Never cite a tool name. Where a needed document is MISSING, or a requirement has no
    verifying test, say so plainly; never fill the gap.
  expected_output: >
    A markdown answer with citations, and a MISSING section listing every gap.
  agent: researcher

ask_review:
  description: >
    Check the researcher's answer to "{request}". Re-run check_coverage or
    verified_by where a claim depends on them. Remove anything uncited or
    contradicted, keep citations as document ids or [graph] (never tool names), keep the MISSING section, and write the final answer for the SE.
  expected_output: >
    The final answer in markdown, then a line "Checked:" listing what you
    re-ran, and a MISSING section (or "MISSING: none").
  agent: se_reviewer

# ── Pipeline B: an SRS from an SE's brief, verified, with an evidence pack ──
# The output is a CANDIDATE draft in work/drafts/. It enters the baseline only
# through Pipeline A (review, SE approval). Certification is the certifying
# authority's decision; the evidence pack supports it and claims nothing.

b1_gather_basis:
  description: >
    Gather the basis for {document} (run {run_id}). Run read_brief: report the
    document to write, the subsystem, every safety-significant function (SSF)
    with its severity, control category, SwCI and level-of-rigor text exactly as
    the tool gives them, and every finding on the brief. Run read_source for each
    source and list its numbered sections: each must be traced by a requirement
    or explained. Run check_coverage and walk_graph (direction impact and up) for
    the subsystem: list its interfaces and their messages and status. Use
    search_standards and standard_clause to find the clauses a software
    requirements specification for this subsystem must follow (the
    DI-IPSC-81433A outline, MIL-STD-882E 4.4 and Appendix B) and quote their
    citations exactly. Do not write requirements.
  expected_output: >
    A markdown basis: the document, the SSF table with SwCI, the source
    sections to account for, the interfaces, the applicable clause citations,
    and the brief's findings for the SE.
  agent: triage

b2_draft_srs:
  description: >
    Write {document} as a complete SRS and save it with save_draft. Use only the
    basis, read_source and the tools: every value (time, rate, signal, state)
    comes from a source section or the brief; if a value you need is not there,
    write TBD rather than invent one.

    FORMAT (the lint enforces it):
    1. Title line "# <ID> — <name>", then the table
       "| Document | Type | Revision | Subsystem |" with one row (Type SRS).
    2. Every paragraph of the DI-IPSC-81433A outline as a numbered heading, in
       order: "## 1 Scope", "### 1.1 Identification", "### 1.2 System overview",
       "### 1.3 Document overview", "## 2 Referenced documents", "## 3 Requirements",
       "### 3.1 Required states and modes" … "### 3.18 Precedence and criticality of
       requirements" (3.3.1 and 3.10.1–3.10.4 as "####"), "## 4 Qualification
       provisions", "## 5 Requirements traceability", "## 6 Notes". A paragraph with
       no requirements says "No requirements." or "This paragraph has been tailored out."
    3. Each requirement on one line "- **<id>** <one sentence with one 'shall'>", ids
       numbered from 010 in steps of 1 or 10 (SRS-ENG-010, SRS-ENG-011, … SRS-ENG-099;
       never SRS-ENG-001 to -009, which are document numbers), with its attribute line
       under it, indented two spaces, for example:
         - **SRS-ENG-020** While ABS active is 01 in EBC1, the software shall inhibit the engine compression brake.
           Safety: SwCI 2 | Verification: T | Traces to: SSF-ENG-01, ICD-ENG-001 §2.1 | Basis: MIL-STD-882E 4.4.2
       Fields: Safety (SwCI n), Timing (value with units), Verification, Traces to, Basis.
       Safety only for safety requirements (all of 3.7), and equal to the SwCI of the
       SSF it traces to. Verification is I, A, D or T. Traces to lists SSF ids and/or
       source sections written "ICD-ENG-001 §2.1". Basis lists ONLY standard
       clauses that standard_clause returns (never a source document); every
       safety requirement cites MIL-STD-882E.
    4. Every SSF is implemented by at least one requirement; every source section
       is traced; every interface message is addressed in 3.3; 3.18 names the
       safety requirements.
    Read every finding save_draft returns, fix all ERRORS and save again (at most
    four saves). Warnings may remain if you say why.
  expected_output: >
    A short note: saves made, the final error and warning counts, each remaining
    warning with the reason, and every TBD with what is missing.
  agent: researcher

b3_verify_srs:
  description: >
    Verify the draft of {document} as the SE who signs off (run {run_id}). Run
    check_draft. For every requirement: (1) confirm each value against the
    source with read_source, quoting both; (2) open each Basis citation with
    standard_clause and say whether the clause really supports the
    requirement, not merely exists; (3) judge it against the ISO/IEC/IEEE 29148
    characteristics by name (necessary, unambiguous, singular, verifiable,
    feasible, correct): these are names only, the standard's text is not held.
    Where a requirement is wrong, uncited or unsupported, correct it or remove
    it with save_draft (never add content without a source), then run
    check_draft again. Flag any hazard the requirements create or leave open.
  expected_output: >
    A markdown review: a table per requirement (value check, basis check,
    characteristics, verdict), the changes you made, open issues for the SE,
    and a last line: VERDICT: READY FOR SE REVIEW or VERDICT: NOT READY.
  agent: se_reviewer

b4_evidence_pack:
  description: >
    Run build_evidence_pack for {document} (run {run_id}) and summarise for the
    SE: the files and what each shows, the CSCI SwCI and its level of rigor,
    the lint counts, and every open item. State plainly that the draft is a
    candidate, that the pack is supporting evidence and not a certification,
    and that the next step is Pipeline A review and SE approval.
  expected_output: >
    A one-page markdown summary of the evidence pack.
  agent: se_reviewer
